<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jorge Luján Rodríguez</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f9f9f9;
      color: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    h1 {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 14px;
      color: #555;
      margin-bottom: 40px;
    }
    .buttons {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    a.btn {
      display: inline-block;
      padding: 14px 28px;
      background: #111;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 0.3px;
      transition: background 0.2s;
    }
    a.btn:hover { background: #333; }
    a.btn.outline {
      background: #fff;
      color: #111;
      border: 2px solid #111;
    }
    a.btn.outline:hover { background: #f0f0f0; }
    footer {
      margin-top: 60px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>

  <h1>Jorge Luján Rodríguez</h1>

  <div class="buttons">
